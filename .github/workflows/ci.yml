name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Reject legacy platform identity names
        run: |
          if grep -R -n -E '\buid\b|world_uid|worldUid|_uid\b' src/; then
            echo "Legacy platform identity found."
            exit 1
          fi
      - run: pnpm run build
